[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruction-mismatch"
version = "0.1.0"
description = "Reliable reconstruction under measurement-operator mismatch: Gaussian deblurring with Tikhonov and Plug-and-Play ADMM, and label-free failure scores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "torch>=2.2",
  "markdown>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
recon-mismatch = "reconstruction_mismatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: end-to-end tests that run the smoke pipeline",
]
